<!DOCTYPE html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>White Grain — Administrimi</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script src="config.js"></script><script type="module" src="admin.js"></script></head><body class="admin-body">
<header class="admin-header"><a class="wordmark" href="/">whitegrain<span>studio®</span></a><button id="logout" type="button" hidden>Dil nga llogaria</button></header>
<main class="admin-main"><p class="label">Paneli i studios</p><h1>Mirë se erdhe.</h1><p id="admin-status" role="status"></p>
<form id="login" class="request-form login-form"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Fjalëkalimi<input type="password" name="password" autocomplete="current-password" required></label><button class="solid-button" type="submit">Hyr në panel ↗</button></form>
<div id="dashboard" hidden><nav class="admin-tabs"><button id="projects-tab" aria-pressed="true">Projektet</button><button id="inquiries-tab" aria-pressed="false">Kërkesat</button></nav>
<section id="projects-panel"><div class="admin-section-heading"><h2>Projektet</h2><button id="new-project" class="solid-button">+ Projekt i ri</button></div>
<form id="project-editor" class="request-form" hidden><input type="hidden" name="id"><h3 id="editor-title">Projekt i ri</h3><div class="form-row"><label>Titulli<input name="title" required maxlength="160"></label><label>Kategoria<select name="category"><option value="identity">Identitet</option><option value="space">Hapësirë</option></select></label></div><div class="form-row"><label>Viti<input name="year" type="number" min="1900" max="2200" required></label><label>Renditja (numri më i vogël shfaqet i pari)<input name="sort_order" type="number" value="0" required></label></div><label>Përshkrimi i shkurtër<input name="subtitle" required maxlength="200"></label><label>Përshkrimi i projektit<textarea name="description" rows="4" required maxlength="5000"></textarea></label><label>Fotot e reja (JPG, PNG, WebP, deri 10 MB secila)<input id="project-files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><p class="form-note">Fotoja e parë është kopertina. Ndrysho rendin ose hiq fotot më poshtë.</p><div id="editor-images"></div><label class="checkbox-label"><input name="published" type="checkbox"> Publiko në portofol</label><div class="editor-actions"><button type="submit" class="solid-button">Ruaj projektin</button><button id="cancel-edit" type="button">Anulo</button></div><p id="editor-status" role="status"></p></form><div id="admin-projects"></div></section>
<section id="inquiries-panel" hidden><h2>Kërkesat e bashkëpunimit</h2><button id="refresh-inquiries" type="button">Rifresko kërkesat</button><div id="admin-inquiries"></div><button id="more-inquiries" type="button" hidden>Shfaq më shumë</button></section></div></main></body></html>
